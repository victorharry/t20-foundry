name: Release

# Publica uma release do sistema no GitHub quando uma tag `vX.Y.Z` é criada.
# Gera `system.json` (com version/manifest/download apontando para a tag) e
# `system.zip` (conteúdo de dist/, já com os packs compilados).
#
#   git tag v1.0.1 && git push origin v1.0.1

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências (sem scripts de pós-instalação)
        run: npm ci --ignore-scripts

      - name: Atualizar system.json com a versão da tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm run update-manifest -- \
            --systemVersion="$VERSION" \
            --manifest="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/system.json" \
            --download="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/system.zip"

      - name: Compilar packs e bundle
        run: npm run build:ci

      - name: Empacotar
        run: |
          cd dist
          zip -r ../system.zip .
          cd ..
          cp dist/system.json ./system.json

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            system.json
            system.zip
          body: |
            **Instalação no Foundry VTT** — em *Game Systems → Install System*, cole a URL do manifesto:

            ```
            https://github.com/${{ github.repository }}/releases/latest/download/system.json
            ```

            Documentação e referências de uso: https://victorharry.github.io/t20-foundry/
